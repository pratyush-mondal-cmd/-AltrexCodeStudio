name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project ZIP
        run: |
          mkdir buildsrc
          unzip -q AltrexStyleCodeStudio-phone-build-v0.1.0.zip -d buildsrc

      - name: Build APK
        working-directory: buildsrc/AltrexStyleCodeStudio
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Code-Studio-APK
          path: buildsrc/AltrexStyleCodeStudio/app/build/outputs/apk/debug/app-debug.apk
